name: build-ios

on:
  push:
    tags:
      - '*'

jobs:
  
  buildiOS:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-Lobanov/setup-xcode@v1
        with:
          xcode-version: 26.2

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v3.0.0
        with:
          dotnet-version: 10.0.x
      
      - name: Install Jex
        shell: bash
        run: |
          npm install

      - name: Run Jex
        shell: bash
        run: node --enable-source-maps ./node_modules/@neurospeech/jex/index.js ./node_modules/@positron-js/cli/content/build-ios.jsx
        env:
          ENC_PASSPHRASE: $${ secrets.ENC_PASSPHRASE }}
          APPLE_DISTRIBUTION_CERT_PASS: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASS }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}          
